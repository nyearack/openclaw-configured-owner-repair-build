name: Qualify configured-owner repair
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: configured-owner-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Qualify public source without caches
        shell: bash
        run: bash qualify.sh
      - name: Retain only validated software for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openclaw-configured-owner-repair
          path: |
            ${{ runner.temp }}/candidate/openclaw-configured-owner-repair.tgz
            ${{ runner.temp }}/candidate/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
